# status-event-mismatch.yaml
#
# Invalid: run_result.status is "success" but terminal_event.event_type
# is "run_failed". finish_run/2 enforces a 1:1 status → event mapping
# (:success → run_completed, :partial → run_partial, :failed →
# run_failed). The schema's cross-field invariant rejects mismatches at
# vet time so producers can't drift the status and event apart.

execution_spec:
  identity:
    name: "csv_to_transactions"
    version: "1.0.0"
  determinism:
    class: "pure"
    cache_policy: "content_addressed"
    replay_policy: "reexecute"
  execution:
    executor: "inline"
    entrypoint: "csv_to_transactions"
    requires_execution_context: false
  isolation:
    env_vars: []
    network: "none"
    bootstrap_read_paths: []
    runtime_read_paths: []
    runtime_write_paths: []
  contracts:
    inputs: {}
    outputs: {}
    decisions:
      may_emit: false
    warnings:
      may_emit: false

op_result:
  outputs: {}
  decisions: []
  warnings: []

run_result:
  run_id: "bookkeeping-20260420T103015-a1b2c3d4"
  status: "success"
  outputs: {}
  event_count: 4
  node_states:
    parse_csv: "completed"
  failed_nodes: []
  warning_count: 0
  degraded_nodes: []
  degraded: false

terminal_event:
  event_type: "run_failed"
  run_id: "bookkeeping-20260420T103015-a1b2c3d4"
  error_type: "run_failure"
  error_message: "one or more nodes failed"
  failed_nodes: []
  warning_summary:
    warning_count: 0
    degraded_node_ids: []
