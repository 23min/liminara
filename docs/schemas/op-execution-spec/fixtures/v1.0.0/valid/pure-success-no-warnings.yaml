# pure-success-no-warnings.yaml
#
# Boundary-edge fixture: a minimal pure deterministic op (CSV → row
# parse) with no decisions, no warnings, single-node run completing
# successfully. Exercises the OPSPEC happy path with everything at its
# default-shaped minimum.

execution_spec:
  identity:
    name: "csv_to_transactions"
    version: "1.0.0"
  determinism:
    class: "pure"
    cache_policy: "content_addressed"
    replay_policy: "reexecute"
  execution:
    executor: "inline"
    entrypoint: "csv_to_transactions"
    requires_execution_context: false
  isolation:
    env_vars: []
    network: "none"
    bootstrap_read_paths: []
    runtime_read_paths: []
    runtime_write_paths: []
  contracts:
    inputs:
      csv_blob: "csv:1"
    outputs:
      transactions: "json-array:1"
    decisions:
      may_emit: false
    warnings:
      may_emit: false

op_result:
  outputs:
    transactions: "sha256:b7e23ec29af22b0b4e41da31e868d57226121c84"
  decisions: []
  warnings: []

run_result:
  run_id: "bookkeeping-20260420T103015-a1b2c3d4"
  status: "success"
  outputs:
    parse_csv:
      transactions: "sha256:b7e23ec29af22b0b4e41da31e868d57226121c84"
  event_count: 4
  node_states:
    parse_csv: "completed"
  failed_nodes: []
  warning_count: 0
  degraded_nodes: []
  degraded: false

terminal_event:
  event_type: "run_completed"
  run_id: "bookkeeping-20260420T103015-a1b2c3d4"
  outcome: "success"
  artifact_hashes:
    - "sha256:b7e23ec29af22b0b4e41da31e868d57226121c84"
  warning_summary:
    warning_count: 0
    degraded_node_ids: []
