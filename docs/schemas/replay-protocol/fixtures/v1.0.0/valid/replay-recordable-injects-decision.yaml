  - event_type: "decision_recorded"
    event_hash: "sha256:b1c2d3e400000000000000000000000000000000000000000000000000000003"
    prev_hash: "sha256:b1c2d3e400000000000000000000000000000000000000000000000000000002"
    timestamp: "2026-04-21T08:00:00.006Z"
    payload:
      node_id: "cluster_summary"
      decision_hash: "sha256:8d23cf6c86e834a7aa6eded54c26ce2bb2e74903bb6bbb2f8c7d17db7c7e3a3a"
      decision_type: "llm_match"

  - event_type: "op_completed"
    event_hash: "sha256:b1c2d3e400000000000000000000000000000000000000000000000000000004"
    prev_hash: "sha256:b1c2d3e400000000000000000000000000000000000000000000000000000003"
    timestamp: "2026-04-21T08:00:00.007Z"
    payload:
      node_id: "cluster_summary"
      cache_hit: false
      duration_ms: 0
      warnings:
        - code: "llm_partial_response"
          severity: "degraded"
          summary: "LLM returned a truncated cluster summary; max_tokens hit before completion"
          cause: "max_tokens=512 exceeded by claude-3-5-sonnet-20241022"
          remediation: "raise max_tokens to 1024 in pack config or shorten prompt"
          affected_outputs:
            - "summary"
      output_hashes:
        - "sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
      output_hashes_by_key:
        summary: "sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"

  - event_type: "run_completed"
    event_hash: "sha256:b1c2d3e400000000000000000000000000000000000000000000000000000005"
    prev_hash: "sha256:b1c2d3e400000000000000000000000000000000000000000000000000000004"
    timestamp: "2026-04-21T08:00:00.008Z"
    payload:
      run_id: "radar-20260421T080000-b1c2d3e4"
      outcome: "success"
      artifact_hashes:
