# radar-realistic.yaml
#
# Realistic fixture: the YAML rendering of the Radar pack as it would
# appear at runtime/apps/liminara_radar/pack.yaml once the Radar
# generated pack.yaml shim lands at M-RUNTIME-02 (E-25).
#
# This is the worked example for ADR-MANIFEST-01. The execution_spec
# values for each op are byte-faithful to the Radar op modules under
# runtime/apps/liminara_radar/lib/liminara/radar/ops/. The op set
# matches `Liminara.Radar.ops/0` (13 ops). Determinism classes match
# each op module's declared class.
#
# Exercises: top-level schema_version + pack_id snake_case +
# pack_version semver, all four determinism classes (pure,
# pinned_env, recordable, side_effecting), all three executors
# (inline, port — task is exercised in the boundary fixture),
# both network capabilities (none, tcp_outbound), env_var
# declarations on recordable ops, contracts.decisions.may_emit and
# contracts.warnings.may_emit on recordable ops, the optional
# init block omitted (Radar does not declare reference data today).

schema_version: 1
pack_id: "radar"
pack_version: "0.1.0"
description: "Daily intelligence briefing pipeline: fetches sources, dedupes and clusters items, ranks and summarizes the cluster set, and renders the briefing as HTML."

ops:
  - execution_spec:
      identity:
        name: "radar_fetch_rss"
        version: "1.0"
      determinism:
        class: "side_effecting"
        cache_policy: "none"
        replay_policy: "skip"
      execution:
        executor: "port"
        entrypoint: "radar_fetch_rss"
        requires_execution_context: false
      isolation:
        env_vars: []
        network: "tcp_outbound"
        bootstrap_read_paths: []
        runtime_read_paths: []
        runtime_write_paths: []
      contracts:
        inputs: {}
        outputs: {}
        decisions:
          may_emit: false
        warnings:
          may_emit: true

  - execution_spec:
